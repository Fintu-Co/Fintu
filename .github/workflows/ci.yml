name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintu-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fintu-api/package-lock.json
      - run: npm ci
      - run: npm test

  landing:
    name: Landing · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintu-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: fintu-landing/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    name: App · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintu-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: fintu-app/package-lock.json
      - run: npm ci
      - run: npm run build
